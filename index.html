<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Training</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">TRAINING</div>
      <button id="signInBtn" class="btn btn-ghost">Sync live</button>
      <span id="signedInAs" class="signed-in-as" hidden></span>
    </header>

    <main id="signedOutView" class="gate" hidden>
      <p>Loading your workouts…</p>
    </main>

    <main id="appView" class="app-view" hidden>
      <div class="cal">
        <div class="cal-head">
          <button class="cal-nav" id="calPrev" aria-label="Previous">&#8249;</button>
          <div class="cal-title" id="calTitle">&nbsp;</div>
          <button class="cal-nav" id="calNext" aria-label="Next">&#8250;</button>
          <div class="view-toggle">
            <button id="viewWeek" class="vt-btn">Week</button>
            <button id="viewMonth" class="vt-btn">Month</button>
          </div>
        </div>
        <div id="calBody"></div>
      </div>

      <section class="day-card">
        <div class="day-card-header">
          <div class="day-number" id="dayNumber">--</div>
          <div class="day-meta">
            <div class="day-weekday" id="dayWeekday">&nbsp;</div>
            <div class="day-monthyear" id="dayMonthYear">&nbsp;</div>
          </div>
          <span class="progress-badge" id="progressBadge" hidden></span>
        </div>

        <div class="sections" id="sections"></div>

        <div class="effort-block" id="effortBlock" hidden>
          <div class="log-label">How hard was it?</div>
          <div class="rpe-row" id="rpeRow"></div>
          <div class="rpe-caption" id="rpeCaption">Tap to rate your effort (RPE 1&ndash;10)</div>
        </div>

        <div class="log-block">
          <label for="notesInput" class="log-label">Notes</label>
          <textarea id="notesInput" placeholder="Weights used, how it felt, anything to remember…"></textarea>
          <div class="log-row">
            <button id="saveBtn" class="btn btn-primary">Save notes</button>
            <span id="saveStatus" class="save-status"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
